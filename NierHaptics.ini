[General]
HapticsEnabled=1

[Haptics]
; Menu pulses follow the game's own menu sounds, so they only fire on real
; cursor, confirm and cancel actions.
MenuEnabled=1
MenuStrength=0.20

; Footsteps follow the game's own footstep sound events, which supply the
; timing, the walk/run cadence and which foot it was.
; Only your own character's steps ever fire; 9S and nearby machines never do.
FootstepsEnabled=1
FootstepStrength=0.035
; FootstepsSprintOnly uses the gait the game names in its own footstep events.
; There are three: walk (the slow stroll), run (ordinary traversal) and dash
; (the sustained sprint). With this on, only the sprint is felt. Set to 0 to
; feel every step at any speed.
FootstepsSprintOnly=1

; World units per second, measured from the position the game reports rather
; than read from a field. Measured over a session: jogging runs 4.5-7.2 and
; sprinting 7.7-14.3, clustering near 10, so 8 splits them. Raise it to demand a
; faster sprint, lower it to feel jogging too, or set 0 to feel every
; non-walking step. Reloads while you play.
FootstepMinSpeed=8.0
FootstepRequireMoving=1
FootstepMinIntervalMs=70

; EnemyHit is NHW1;dur=0.09;gain=0.5;bal=0;L=55,1,30 (the studio's soft thump).
; EnemyHitStrength carries the code's gain, so change it to re-scale the effect.
; It fires on the melee hit-confirm sound of every weapon class, including
; unarmed. Drone fire and drone impacts never vibrate. Hit-confirms outside the
; core_pl_ namespace are shared with the companion, so they only count as yours
; when one of your own swings happened within MeleeAttributionWindowMs.
EnemyHitEnabled=1
MeleeAttributionWindowMs=700
EnemyHitStrength=0.50
PlayerHitEnabled=1
PlayerHitStrength=0.90

[Gameplay]
; Repeated air jumps. The game's jump counter reaches 2 on a double jump, so
; holding it at 0 leaves a jump always available. The offset is into the player
; object and was found with the jump probe; change it here if a game update
; moves it rather than needing a rebuild.
MultiJumpEnabled=1
MultiJumpCounterOffset=0x14A8
MultiJumpHoldValue=0
MultiJumpSaneMax=8

; Keep plug-in chips through death. The game's own penalty routine - the one
; that flags equipped chips as lying on your corpse and unequips them - is
; disabled, so death changes nothing about your loadout. Your body still
; appears where you died and can still be recovered for the usual repair or
; ally options; it simply holds no chips, so recovering it cannot duplicate
; anything.
KeepChipsOnDeath=1

; Lets the Easy-only auto chips be equipped at any difficulty. Applied in
; memory, so turning it off leaves anything already equipped alone; those chips
; only become unequippable once you take them out.
EasyChipsAnywhere=0

; Walks the title menu for you to reach the most recent save. OFF by default:
; the presses are blind rather than reading the menu, so if your title menu is
; not laid out as expected they could land on the wrong entry. Touching the pad
; or stick cancels whatever is still queued, and the log records every press.
; after the title screen appears before the first one.
AutoLoadLastSave=0
AutoLoadPresses=2
AutoLoadDelayMs=2500

[Overlay]
; In-game settings panel drawn on the game's own renderer. Press the toggle key
; to show and hide it.
Enabled=1

; Which key toggles the panel, as a Windows virtual-key code.
; 0x79 = F10, 0x78 = F9, 0x7A = F11, 0x2D = Insert, 0xC0 = the ` key.
; Change this if another tool of yours already uses F10.
ToggleKeyVirtualCode=0x79

; Diagnostics, normally 0. PassthroughOnly hooks the renderer but draws nothing;
; ProbeOnly skips hooking entirely; StartupDelayMs waits before touching Direct3D.
PassthroughOnly=0
ProbeOnly=0
StartupDelayMs=0

[Diagnostics]
; Logs each distinct sound-event name the game posts, once per name, and marks
; the ones attributed to your character. Set to 0 once it is no longer needed.
LogSoundNames=1

; Read-only probe that identifies the air-jump counter from real play: when you
; jump it reports which small integers in the player object stepped up by one.
; Jump twice in a row a few times and the counter shows itself as 0->1 then
; 1->2. Reports at most a dozen times per session. Set to 0 to disable.
ProbeJumpFields=1
