[General]
HapticsEnabled=1
HitstopEnabled=1

[Hitstop]
; Slow motion applied when a hit connects. HitstopSpeed is a fraction of normal
; game speed. HitstopMinIntervalMs stops rapid combos from chaining one hitstop
; into a continuous slowdown.
HitstopSpeed=0.35
HitstopDurationMs=130
HitstopMinIntervalMs=240

[Haptics]
; Menu pulses follow the game's own menu sounds, so they only fire on real
; cursor, confirm and cancel actions.
MenuEnabled=1
MenuStrength=0.20

; Footsteps follow the game's own footstep sound events, which supply both the
; timing and the walk/run cadence. FootstepRequireMoving rejects footstep sounds
; from other characters while the player is standing still.
FootstepsEnabled=1
FootstepStrength=0.035
FootstepRequireMoving=1
FootstepSpeedThreshold=0.35

EnemyHitEnabled=1
EnemyHitStrength=0.62
PlayerHitEnabled=1
PlayerHitStrength=0.90

[Diagnostics]
; Logs each distinct sound-event name the game posts, once per name. Useful for
; mapping new events; set to 0 once the log is no longer needed.
LogSoundNames=1
