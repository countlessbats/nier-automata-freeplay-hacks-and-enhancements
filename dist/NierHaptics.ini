[General]
HapticsEnabled=1
HitstopEnabled=1

[Hitstop]
; Hitstop now drives the game's own time-acceleration system rather than
; scaling the process clock, so it slows the action without touching the frame
; rate. Fires on melee hits only.
; The engine's own slow-motion moments use rates of 0.1 to 0.5 over 8 to 30
; frames; 0.15 for 250 ms is a deliberately obvious setting to confirm it works.
; Something like 0.3 for 120 ms is a reasonable everyday value.
HitstopSpeed=0.15
HitstopDurationMs=250
HitstopMinIntervalMs=300
; The engine's time acceleration turned out to slow only the player, so enemy
; animation rates are scaled for the same window to slow them too.
HitstopAffectsEnemies=1

[Haptics]
; Menu pulses follow the game's own menu sounds, so they only fire on real
; cursor, confirm and cancel actions.
MenuEnabled=1
MenuStrength=0.20

; Footsteps follow the game's own footstep sound events, which supply the
; timing, the walk/run cadence and which foot it was.
; FootstepPlayerOnly restricts them to the character you are controlling, so
; 9S and nearby machines do not fill the gaps between your own steps.
FootstepsEnabled=1
FootstepStrength=0.035
FootstepPlayerOnly=1
FootstepRequireMoving=1
FootstepMinIntervalMs=70

; EnemyHit fires on the melee hit-confirm sound. That sound is shared with the
; companion, so it only counts as yours when one of your own swings happened
; within MeleeAttributionWindowMs. Pod fire and pod impacts never vibrate.
EnemyHitEnabled=1
MeleeAttributionWindowMs=700
EnemyHitStrength=0.62
PlayerHitEnabled=1
PlayerHitStrength=0.90

[Diagnostics]
; Logs each distinct sound-event name the game posts, once per name, and marks
; the ones attributed to your character. Set to 0 once it is no longer needed.
LogSoundNames=1
